---
name: Docker Security

"on":
  push:
    branches: [main]
    paths:
      - docker/**
      - build.env
      - .github/workflows/docker-security.yml
  pull_request:
    paths:
      - docker/**
      - build.env
      - .github/workflows/docker-security.yml
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  env:
    runs-on: ubuntu-latest
    outputs:
      odr-padenc-version: ${{ steps.env.outputs.ODR_PADENC_VERSION }}
      odr-audioenc-version: ${{ steps.env.outputs.ODR_AUDIOENC_VERSION }}
      odr-dabmux-version: ${{ steps.env.outputs.ODR_DABMUX_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load build environment
        id: env
        run: grep '^ODR_.*_VERSION=' build.env >> "$GITHUB_OUTPUT"

  security:
    name: ${{ matrix.image_name }}
    needs: env
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with the image list in docker-build.yml's "Set matrix" step
        include:
          - image_name: odr-padenc
            tool: odr-padenc
            variant: ""
          - image_name: odr-audioenc-minimal
            tool: odr-audioenc
            variant: minimal
          - image_name: odr-audioenc-full
            tool: odr-audioenc
            variant: full
          - image_name: odr-dabmux
            tool: odr-dabmux
            variant: ""
    uses: oszuidwest/.github-templates/.github/workflows/docker-security-build.yml@main
    with:
      dockerfile-path: docker/Dockerfile
      build-args: |
        TOOL=${{ matrix.tool }}
        VERSION=${{ needs.env.outputs[format('{0}-version', matrix.tool)] }}
        VARIANT=${{ matrix.variant }}
      category: security-scan-${{ matrix.image_name }}
      event-name: ${{ github.event_name }}
      repository-private: ${{ github.event.repository.private }}
